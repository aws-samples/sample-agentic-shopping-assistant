[project]
name = "aria-indexer"
version = "0.1.0"
description = "Index a catalog into OpenSearch from its catalog definition; runs as an in-VPC Fargate task"
requires-python = ">=3.13"
dependencies = ["aria-catalog", "boto3>=1.43.0", "opensearch-py>=3.0.0"]

[dependency-groups]
dev = ["pytest>=8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-q", "--tb=short", "--disable-warnings"]

[tool.ruff]
line-length = 120

[tool.uv.sources]
aria-catalog = { path = "../catalog", editable = true }
